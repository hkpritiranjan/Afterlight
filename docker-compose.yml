services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: afterlight
      POSTGRES_USER: afterlight
      POSTGRES_PASSWORD: afterlight_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterlight -d afterlight"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
